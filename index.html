<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waguri — AI Chat Assistant</title>
    <meta name="description" content="Waguri — a refined AI chat assistant. Multi-thread history stored in IndexedDB, synced live across tabs." />
    <meta property="og:title" content="Waguri — AI Chat Assistant" />
    <meta property="og:description" content="A refined AI chat assistant. Multi-thread history, live cross-tab sync, always-on model routing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="assets/mascot.jpg" />
    <link rel="apple-touch-icon" href="assets/mascot.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-art" aria-hidden="true"></div>
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>

    <aside id="sidebar" class="sidebar" aria-label="Conversations sidebar">
      <div class="brand">
        <img class="brand-mark" src="assets/mascot.jpg" alt="Waguri" width="36" height="36" />
        <div>
          <div class="brand-title">Waguri</div>
          <div class="brand-sub">0.1 Beta</div>
        </div>
      </div>

      <button id="newThreadBtn" class="btn btn-primary" aria-label="Start a new chat">
        <span aria-hidden="true">+</span> New Chat
      </button>

      <div class="threads-label" id="threadsLabel">Conversations</div>
      <div id="threadsList" class="threads" role="list" aria-labelledby="threadsLabel"></div>

      <div class="attribution">Made by <span class="mcy">MCY</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Open conversations menu" aria-controls="sidebar" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title">Waguri</div>
        <label class="model-picker" for="modelSelect">
          <span class="dot" aria-hidden="true"></span>
          <select id="modelSelect" aria-label="Choose AI model">
            <option value="google/gemini-3.1-pro-preview">Gemini 3.5 Pro</option>
            <option value="openai/gpt-5.6-luna">GPT 6</option>
          </select>
        </label>
        <span id="modelLabel" class="model-status" aria-live="polite">Ready</span>
        <div class="tb-actions">
          <button id="settingsBtn" class="tb-btn" aria-label="Open settings" title="Settings" aria-haspopup="dialog">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button id="themeBtn" class="tb-btn" aria-label="Toggle theme" title="Toggle theme">
            <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <div class="tb-menu-wrap">
            <button id="exportBtn" class="tb-btn" aria-label="Export chat" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu" title="Export chat">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <div id="exportMenu" class="tb-menu" role="menu" aria-label="Export options">
              <button role="menuitem" data-export="copy-current">Copy current chat</button>
              <div class="divider" role="separator"></div>
              <button role="menuitem" data-export="current-json">Current chat · JSON</button>
              <button role="menuitem" data-export="current-txt">Current chat · TXT</button>
              <div class="divider" role="separator"></div>
              <button role="menuitem" data-export="all-json">All chats · JSON</button>
              <button role="menuitem" data-export="all-txt">All chats · TXT</button>
            </div>
          </div>
        </div>
      </header>

      <section id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Chat messages"></section>

      <div id="attachRow" class="attach-row" aria-label="Attached files"></div>
      <form id="composer" class="composer">
        <input id="fileInput" type="file" accept="image/*,.txt,.md,.csv,.json,.log,text/plain" multiple hidden />
        <button id="attachBtn" class="tb-btn tool-btn" type="button" aria-label="Attach image or text file" title="Attach image or .txt">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button id="searchBtn" class="tb-btn tool-btn" type="button" aria-pressed="false" aria-label="Toggle web search" title="Search the web">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <textarea
          id="input"
          placeholder="Type here To send"
          rows="1"
          autocomplete="off"
          aria-label="Message input"
        ></textarea>
        <button id="sendBtn" class="btn btn-primary send" type="submit" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </main>

    <div id="settingsOverlay" class="overlay" role="presentation">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="settingsClose" class="tb-btn" aria-label="Close settings">✕</button>
        </div>

        <div class="modal-section">
          <div class="modal-label">Response model</div>
          <p class="modal-hint">Gemini Pro is suited to deeper work. GPT Quick is tuned for fast everyday answers.</p>
          <label class="field">
            <span>Preferred model</span>
            <select id="settingsModelSelect" aria-label="Preferred AI model">
              <option value="google/gemini-3.1-pro-preview">Gemini Pro</option>
              <option value="openai/gpt-5.6-luna">GPT Quick</option>
            </select>
          </label>
        </div>

        <div class="modal-section">
          <div class="modal-label">Retries</div>
          <label class="field">
            <span>Retry attempts <output id="retriesOut">3</output></span>
            <input id="retriesRange" type="range" min="1" max="6" step="1" value="3" aria-label="Retry attempts" />
          </label>
          <label class="field">
            <span>Initial backoff <output id="backoffOut">700 ms</output></span>
            <input id="backoffRange" type="range" min="100" max="4000" step="100" value="700" aria-label="Initial backoff in milliseconds" />
          </label>
          <label class="field">
            <span>Backoff mode</span>
            <select id="backoffMode" aria-label="Backoff mode">
              <option value="linear">Linear (delay × attempt)</option>
              <option value="exponential">Exponential (delay × 2ⁿ)</option>
              <option value="fixed">Fixed delay</option>
            </select>
          </label>
        </div>

        <div class="modal-foot">
          <button id="settingsReset" class="btn" type="button">Reset defaults</button>
          <button id="settingsSave" class="btn btn-primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
